name: Expo SDK 55 dependency remediation

on:
  push:
    branches:
      - feature/spatial-event-digital-twin

permissions:
  contents: write

concurrency:
  group: expo-sdk55-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      EXPO_PUBLIC_SENTRY_ENV: ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Align packages with Expo SDK 55
        run: npx expo install --fix --npm

      - name: Pin patched YAML parsers inside build-only dependency paths
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides ?? {}),
            '@istanbuljs/load-nyc-config': {
              ...((pkg.overrides ?? {})['@istanbuljs/load-nyc-config'] ?? {}),
              'js-yaml': '3.15.1',
            },
            '@expo/xcpretty': {
              ...((pkg.overrides ?? {})['@expo/xcpretty'] ?? {}),
              'js-yaml': '4.3.1',
            },
            cosmiconfig: {
              ...((pkg.overrides ?? {}).cosmiconfig ?? {}),
              'js-yaml': '4.3.1',
            },
          };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --ignore-scripts

      - name: Validate remediated dependency state
        shell: bash
        run: |
          set -euo pipefail
          npx expo-doctor
          npx tsc --noEmit --pretty false
          npm audit --omit=dev --json > npm-audit.json || true
          node scripts/enforce-npm-audit-policy.mjs npm-audit.json security/npm-audit-policy.json

      - name: Commit validated package state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency state already aligned.'
            exit 0
          fi
          git commit -m 'chore(deps): align Expo SDK 55 and patched build dependencies'
          git push origin HEAD:${GITHUB_REF_NAME}
