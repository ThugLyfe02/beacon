          replaceRequired(
            'src/components/PartnerCommitmentLedgerPanel.tsx',
            `<NeonText variant="label" tone="warning">MANUAL OPERATOR EVIDENCE</NeonText>\n                    <NeonText variant="bodyMuted" style={styles.smallTop}>Manual quantities remain explicitly lower-quality than server-recorded delivery. They never become hidden “verified” facts.</NeonText>`,
