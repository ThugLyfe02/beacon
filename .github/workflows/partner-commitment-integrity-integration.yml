          // Documentation.
          insertBefore(
            'docs/PARTNER_COMMITMENT_LEDGER.md',
            '\n## Product language\n',
            `\n## Contract-integrity layer\n\n### Accepted terms remain effective during amendment review\n\nCreating a revision does not silently replace an accepted obligation. If an 8-slot commitment is accepted and one party proposes 12 slots, the shared ledger continues to show 8 as the effective contract while the 12-slot amendment waits for fresh required acceptance. A rejected or withdrawn amendment therefore cannot erase the prior operating agreement.\n\n### Manual evidence is reviewable, not self-verifying\n\nA community can manually assert delivery only for its own commitment; the host cannot author that community's delivery quantity. Host commitments are similarly authored by the host. The other required parties can independently acknowledge or dispute the underlying manual assertion. Pending or disputed manual evidence may remain visible for audit, but it cannot finalize fulfilled / partially fulfilled / not fulfilled state.\n\nThis is deliberately different from asking Beacon to decide who is telling the truth. Beacon records who asserted the quantity and whether the other contractual parties acknowledged or disputed it.\n\n### No double-claiming indistinguishable obligations\n\nTwo accepted commitments from the same party with the same resource type, same domain and overlapping delivery window are rejected as operationally ambiguous. The party must revise the existing obligation or use a genuinely distinct time/domain contract. This prevents one Office Hours session or Focus Window from being presented as fulfillment of two indistinguishable promises.\n\n### Evidence semantics must match the source\n\nA server event may support only the semantics it actually records. For example, current Office Hours rows do not carry a reviewed domain field. Beacon therefore refuses to auto-verify a domain-specific Office Hours commitment from generic completed Office Hours traffic; the contribution needs stronger provenance or an explicit manual assertion subject to counterpart review.\n\n### Longitudinal memory carries measurement coverage\n\nHistorical delivery and utilization averages exclude events with missing, insufficient, disputed or still-pending manual evidence. The memory surface reports how many ended events actually had admissible measurement and the corresponding coverage share. Unknown evidence is never coerced to zero use.\n\nThis allows Beacon to say that a commitment pattern was repeatedly unused only when it was repeatedly **measured** as delivered but unused.\n\n### Delete-path hardening\n\nCore revisions, decisions, lifecycle events, measurements, source links, closeout rows and manual-review events reject both in-place updates and deletes at the database boundary. The normal product lifecycle is supersession and explicit terminal events, not history rewriting. Any future compliance erasure path deserves a separate, auditable system rather than a generic mutation endpoint.\n`,
            '## Contract-integrity layer',
          );

          // Validator: production invariants for the deeper integrity layer.
          insertBefore(
            'scripts/validate-partner-commitment-ledger.mjs',
            `if (failures.length > 0) {`,
            `const integrityMigration = 'supabase/migrations/064_partner_commitment_contract_integrity.sql';\nread(integrityMigration);\nrequireText(integrityMigration, 'partner_commitment_effective_revision', 'accepted terms must remain effective while an amendment awaits fresh approval');\nrequireText(integrityMigration, 'partner_commitment_pending_revision', 'pending amendments must be represented separately from effective contract state');\nrequireText(integrityMigration, 'an overlapping accepted commitment already covers this party, resource type, domain, and delivery window', 'semantically duplicate overlapping commitments must fail closed instead of double-claiming activity');\nrequireText(integrityMigration, 'partner_commitment_manual_measurement_reviews', 'manual delivery assertions need append-only counterparty review');\nrequireText(integrityMigration, "decision text not null check (decision in ('acknowledged','disputed'))", 'manual evidence review must preserve explicit acknowledgement and dispute semantics');\nrequireText(integrityMigration, 'manual delivery assertion may be authored only by the committed party', 'host must not fabricate manual delivery quantities for a partner');\nrequireText(integrityMigration, 'manual delivery evidence must be acknowledged by every required counterparty before it can finalize the commitment', 'unreviewed manual claims must not finalize fulfillment');\nrequireText(integrityMigration, 'before update or delete', 'append-only commitment evidence must resist delete-path history rewriting');\nrequireText(integrityMigration, 'domain-specific Office Hours lacks server-recorded domain provenance', 'generic Office Hours telemetry must not overclaim domain-specific fulfillment');\nrequireText(integrityMigration, 'measurement_coverage', 'longitudinal usage claims must expose evidence coverage rather than coerce unknown to zero');\nrequireText(integrityMigration, "filter (where r.measurement_admissible)", 'historical delivery and utilization averages must exclude inadmissible measurements');\nrequireText(service, ".rpc('review_partner_commitment_manual_measurement'", 'manual evidence review must cross a server-scoped RPC boundary');\nrequireText(panel, 'CURRENT CONTRACT REMAINS EFFECTIVE', 'partner UX must make amendment effectiveness explicit');\nrequireText(panel, 'Unknown measurements are excluded rather than treated as zero.', 'longitudinal UX must distinguish missing evidence from zero utilization');\nrequireText(panel, 'DISPUTE', 'counterpart UX must support explicit non-scoring disagreement with a manual assertion');\nforbidText(integrityMigration, 'partner_value_score', 'contract integrity must not introduce a synthetic partner value rank');\nforbidText(integrityMigration, 'fairness_score', 'contract integrity must not introduce a fairness leaderboard');\n\n`,
            'const integrityMigration =',
          );
          NODE

      - name: Validate integrated commitment ledger
        shell: bash
        run: |
