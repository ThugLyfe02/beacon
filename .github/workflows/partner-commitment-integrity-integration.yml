            'MANUAL EVIDENCE · {row.measurementReviewState',
          );

          replaceRequired(
            'src/components/PartnerCommitmentLedgerPanel.tsx',
            `<Pressable disabled={working} onPress={() => decide(row, 'accepted')}`,
            `<Pressable disabled={working} onPress={() => decideRevision(row.revisionId, 'accepted')}`,
          );
          replaceRequired(
            'src/components/PartnerCommitmentLedgerPanel.tsx',
            `<Pressable disabled={working} onPress={() => decide(row, 'rejected')}`,
            `<Pressable disabled={working} onPress={() => decideRevision(row.revisionId, 'rejected')}`,
          );

          replaceRequired(
            'src/components/PartnerCommitmentLedgerPanel.tsx',
            `                    <Pressable\n                      disabled={working}\n                      onPress={() => {`,
            `                    {row.callerCanManage ? <Pressable\n                      disabled={working}\n                      onPress={() => {`,
          );
          replaceRequired(
            'src/components/PartnerCommitmentLedgerPanel.tsx',
            `                      <NeonText variant="label" tone="muted">MANUAL ACKNOWLEDGEMENT</NeonText>\n                    </Pressable>`,
            `                      <NeonText variant="label" tone="muted">MANUAL ACKNOWLEDGEMENT</NeonText>\n                    </Pressable> : null}`,
