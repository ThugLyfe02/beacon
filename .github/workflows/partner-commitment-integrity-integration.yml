name: Partner commitment contract integrity integration

on:
  push:
    branches:
      - feature/spatial-event-digital-twin

permissions:
  contents: write

concurrency:
  group: partner-commitment-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Integrate contract-integrity model and UX
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, value) { fs.writeFileSync(path, value); }
          function replaceRequired(path, before, after) {
            let source = read(path);
            if (source.includes(after)) return;
            if (!source.includes(before)) throw new Error(`${path}: required seam not found: ${before.slice(0, 80)}`);
            source = source.replace(before, after);
            write(path, source);
          }
          function insertBefore(path, marker, addition, idempotencyNeedle = addition) {
            let source = read(path);
            if (source.includes(idempotencyNeedle)) return;
            const index = source.indexOf(marker);
            if (index < 0) throw new Error(`${path}: marker not found: ${marker.slice(0, 80)}`);
            source = `${source.slice(0, index)}${addition}${source.slice(index)}`;
            write(path, source);
          }
          function insertAfter(path, marker, addition, idempotencyNeedle = addition) {
            let source = read(path);
            if (source.includes(idempotencyNeedle)) return;
            const index = source.indexOf(marker);
            if (index < 0) throw new Error(`${path}: marker not found: ${marker.slice(0, 80)}`);
            const point = index + marker.length;
            source = `${source.slice(0, point)}${addition}${source.slice(point)}`;
            write(path, source);
          }

          // Fix the wrapper's PL/pgSQL composite assignment before this migration
          // is ever applied to a database.
          replaceRequired(
            'supabase/migrations/064_partner_commitment_contract_integrity.sql',
            `  select r.*, r.commitment_id into v_revision, v_commitment_id\n  from public.partner_commitment_revisions r where r.id = p_revision_id;`,
            `  select * into v_revision\n  from public.partner_commitment_revisions r where r.id = p_revision_id;\n  v_commitment_id := v_revision.commitment_id;`,
          );

          // Client semantic model.
          insertBefore(
            'src/partners/PartnerCommitmentModel.ts',
            'export interface PartnerCommitmentOption {',
            `export type PartnerCommitmentMeasurementReviewState =\n  | 'not-required'\n  | 'pending'\n  | 'acknowledged'\n  | 'disputed';\n\n`,
            'PartnerCommitmentMeasurementReviewState',
