name: Offline handshake dependency preparation

on:
  push:
    branches:
      - feature/spatial-event-digital-twin

permissions:
  contents: write

concurrency:
  group: offline-handshake-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Expo-compatible local security, randomness, and QR rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          npx expo install expo-secure-store expo-crypto react-native-svg
          npm install react-native-qrcode-svg
          npx expo install --fix --npm
      - name: Validate Expo package alignment
        shell: bash
        run: |
          set -euo pipefail
          npx expo-doctor
          npx tsc --noEmit --pretty false
      - name: Commit dependency state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency state already present.'
            exit 0
          fi
          git commit -m 'chore(deps): add secure offline handshake support'
          git push origin HEAD:${GITHUB_REF_NAME}
