name: Warm introduction integration

on:
  push:
    branches:
      - feature/spatial-event-digital-twin

permissions:
  contents: write

concurrency:
  group: warm-introduction-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Integrate warm introductions into live participant and host flows
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after, label) {
            const source = fs.readFileSync(path, 'utf8');
            const occurrences = source.split(before).length - 1;
            if (occurrences !== 1) {
              throw new Error(`${label}: expected exactly one anchor in ${path}, found ${occurrences}`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceOnce(
            'src/spatial/AvatarActionSheet.tsx',
            "import { blockUser, reportUser } from '../services/abuse.service';\n",
            "import { blockUser, reportUser } from '../services/abuse.service';\nimport WarmIntroductionRequestCard from '../components/WarmIntroductionRequestCard';\n",
            'avatar action import',
          );

          replaceOnce(
            'src/spatial/AvatarActionSheet.tsx',
            "  const hasDeclaredFit = declaredFitStrength > 0 && (theyCanHelp.length > 0 || iCanHelp.length > 0);\n",
            "  const hasDeclaredFit = declaredFitStrength > 0 && (theyCanHelp.length > 0 || iCanHelp.length > 0);\n  const introductionDomains = [...new Set([...theyCanHelp, ...iCanHelp])].sort();\n",
            'avatar introduction domains',
          );

          replaceOnce(
            'src/spatial/AvatarActionSheet.tsx',
            "              ) : null}\n\n              <View style={[styles.directionCard, !direction.available && styles.directionCardMuted]}>",
            "              ) : null}\n\n              {hasDeclaredFit ? (\n                <WarmIntroductionRequestCard\n                  eventId={target.eventId}\n                  targetId={target.targetId}\n                  domains={introductionDomains}\n                />\n              ) : null}\n\n              <View style={[styles.directionCard, !direction.available && styles.directionCardMuted]}>",
            'avatar request card',
          );

          replaceOnce(
            'src/screens/EventIntentScreen.tsx',
            "import ParticipantEventPlaybookCard from '../components/ParticipantEventPlaybookCard';\n",
            "import ParticipantEventPlaybookCard from '../components/ParticipantEventPlaybookCard';\nimport WarmIntroductionPreferenceCard from '../components/WarmIntroductionPreferenceCard';\n",
            'event focus preference import',
          );

          replaceOnce(
            'src/screens/EventIntentScreen.tsx',
            "      <ParticipantEventPlaybookCard\n        eventId={eventId}\n        seeking={seeking}\n        offering={offering}\n        onApply={applyPlaybookSuggestion}\n      />\n\n      <View style={styles.section}>",
            "      <ParticipantEventPlaybookCard\n        eventId={eventId}\n        seeking={seeking}\n        offering={offering}\n        onApply={applyPlaybookSuggestion}\n      />\n\n      <WarmIntroductionPreferenceCard eventId={eventId} />\n\n      <View style={styles.section}>",
            'event focus preference card',
          );

          replaceOnce(
            'src/screens/EventLobbyScreen.tsx',
            'import EventFocusWindowCard from "../components/EventFocusWindowCard";\n',
            'import EventFocusWindowCard from "../components/EventFocusWindowCard";\nimport IntroductionInboxPreview from "../components/IntroductionInboxPreview";\n',
            'event lobby inbox import',
          );

          replaceOnce(
            'src/screens/EventLobbyScreen.tsx',
            '      <EventFocusWindowCard eventId={eventId} />\n      <VenueServiceStatusCard eventId={eventId} />',
            '      <EventFocusWindowCard eventId={eventId} />\n      <IntroductionInboxPreview eventId={eventId} />\n      <VenueServiceStatusCard eventId={eventId} />',
            'event lobby inbox preview',
          );

          replaceOnce(
            'src/screens/EventIntentMixScreen.tsx',
            "import HostFocusWindowPanel from '../components/HostFocusWindowPanel';\n",
            "import HostFocusWindowPanel from '../components/HostFocusWindowPanel';\nimport IntroductionEvidenceCard from '../components/IntroductionEvidenceCard';\n",
            'host evidence import',
          );

          replaceOnce(
            'src/screens/EventIntentMixScreen.tsx',
            "      </Surface>\n\n      {programming.length > 0 ? (",
            "      </Surface>\n\n      <IntroductionEvidenceCard eventId={eventId} />\n\n      {programming.length > 0 ? (",
            'host evidence card',
          );

          replaceOnce(
            'src/navigation/RootNavigator.tsx',
            "import EventIntentMixScreen from '../screens/EventIntentMixScreen';\n",
            "import EventIntentMixScreen from '../screens/EventIntentMixScreen';\nimport IntroductionInboxScreen from '../screens/IntroductionInboxScreen';\n",
            'navigator inbox import',
          );

          replaceOnce(
            'src/navigation/RootNavigator.tsx',
            "        <Stack.Screen\n          name=\"SpatialField\"",
            "        <Stack.Screen\n          name=\"IntroductionInbox\"\n          component={IntroductionInboxScreen}\n          options={{\n            headerShown: true,\n            title: 'Warm Introductions',\n            headerStyle: { backgroundColor: palette.space },\n            headerTitleStyle: { color: palette.text, fontWeight: '700' },\n            headerTintColor: palette.premium,\n            animation: 'slide_from_right',\n          }}\n        />\n\n        <Stack.Screen\n          name=\"SpatialField\"",
            'navigator inbox route',
          );

          replaceOnce(
            '.github/workflows/venue-operations-gate.yml',
            '          node scripts/validate-participant-event-playbook.mjs\n',
            '          node scripts/validate-participant-event-playbook.mjs\n          node scripts/validate-warm-introductions.mjs\n',
            'venue gate warm-introduction validator',
          );

          replaceOnce(
            'scripts/validate-warm-introductions.mjs',
            "requireText(protocolMigration, 'no connector list, graph-degree score, free-text pitch', 'the server contract must explicitly reject graph exposure and unsolicited free text');",
            "requireText(protocolMigration, 'No connector list, graph-degree score, free-text pitch', 'the server contract must explicitly reject graph exposure and unsolicited free text');",
            'warm introduction assertion casing',
          );
          NODE

      - name: Validate strict types and architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit --pretty false
          node scripts/validate-venue-operations.mjs
          node scripts/validate-venue-memory.mjs
          node scripts/validate-venue-sensor-ingress.mjs
          node scripts/validate-spatial-direction.mjs
          node scripts/validate-participant-venue-guide.mjs
          node scripts/validate-event-intent-exchange.mjs
          node scripts/validate-event-focus-windows.mjs
          node scripts/validate-participant-event-playbook.mjs
          node scripts/validate-warm-introductions.mjs

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/spatial/AvatarActionSheet.tsx \
            src/screens/EventIntentScreen.tsx \
            src/screens/EventLobbyScreen.tsx \
            src/screens/EventIntentMixScreen.tsx \
            src/navigation/RootNavigator.tsx \
            .github/workflows/venue-operations-gate.yml \
            scripts/validate-warm-introductions.mjs
          git commit -m 'feat(events): integrate consent-gated warm introductions'
          git push origin HEAD:${GITHUB_REF_NAME}
