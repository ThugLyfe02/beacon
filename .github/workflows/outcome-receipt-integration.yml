name: Participant outcome receipt integration

on:
  push:
    branches:
      - feature/spatial-event-digital-twin

permissions:
  contents: write

concurrency:
  group: outcome-receipt-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Integrate host and community receipt evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function insertImport(path, existingImport, newImport) {
            let source = fs.readFileSync(path, 'utf8');
            if (source.includes(newImport)) return;
            if (!source.includes(existingImport)) throw new Error(`${path}: import seam not found`);
            source = source.replace(existingImport, `${existingImport}\n${newImport}`);
            fs.writeFileSync(path, source);
          }

          insertImport(
            'src/screens/HostManagementScreen.tsx',
            "import HandshakeHealthCard from '../components/HandshakeHealthCard';",
            "import OutcomeReceiptEvidenceCard from '../components/OutcomeReceiptEvidenceCard';",
          );

          {
            const path = 'src/screens/HostManagementScreen.tsx';
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes('<OutcomeReceiptEvidenceCard eventId={event.id} />')) {
              const marker = '<HandshakeHealthCard eventId={event.id} />';
              const markerIndex = source.indexOf(marker);
              if (markerIndex < 0) throw new Error(`${path}: handshake health marker not found`);
              const closeIndex = source.indexOf('</View>', markerIndex);
              if (closeIndex < 0) throw new Error(`${path}: host section close not found`);
              const insertionPoint = closeIndex + '</View>'.length;
              source = `${source.slice(0, insertionPoint)}\n\n      <View style={styles.section}>\n        <OutcomeReceiptEvidenceCard eventId={event.id} />\n      </View>${source.slice(insertionPoint)}`;
              fs.writeFileSync(path, source);
            }
          }

          insertImport(
            'src/screens/CommunityExchangeScreen.tsx',
            "import CommunitySupplyDemandPanel from '../components/CommunitySupplyDemandPanel';",
            "import CommunityOutcomeReceiptEvidence from '../components/CommunityOutcomeReceiptEvidence';",
          );

          {
            const path = 'src/screens/CommunityExchangeScreen.tsx';
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes('<CommunityOutcomeReceiptEvidence exchangeId={exchange.exchange_id} />')) {
              const marker = "{exchange.state === 'active' ? (";
              const markerIndex = source.indexOf(marker);
              if (markerIndex < 0) throw new Error(`${path}: active exchange marker not found`);
              const closeMarker = '\n            </Surface>';
              const closeIndex = source.indexOf(closeMarker, markerIndex);
              if (closeIndex < 0) throw new Error(`${path}: active exchange surface close not found`);
              const insertion = "\n              {exchange.state === 'active' ? (\n                <CommunityOutcomeReceiptEvidence exchangeId={exchange.exchange_id} />\n              ) : null}";
              source = `${source.slice(0, closeIndex)}${insertion}${source.slice(closeIndex)}`;
              fs.writeFileSync(path, source);
            }
          }
          NODE

      - name: Validate receipt implementation
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit --pretty false
          node scripts/validate-participant-outcome-receipts.mjs
          node scripts/validate-offline-event-handshake.mjs
          node scripts/validate-community-exchange.mjs
          node scripts/validate-product-preservation.mjs

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/HostManagementScreen.tsx src/screens/CommunityExchangeScreen.tsx
          git commit -m 'feat(outcomes): integrate receipt evidence into host and community flows'
          git push origin HEAD:${GITHUB_REF_NAME}
