name: Handshake dependency security remediation

on:
  push:
    branches:
      - feature/spatial-event-digital-twin

permissions:
  contents: write

concurrency:
  group: handshake-security-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependency graph
        run: npm ci --ignore-scripts
      - name: Apply semver-compatible audit remediation to lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --omit=dev || true
          npm ci --ignore-scripts
          npm audit --omit=dev --json > npm-audit-after.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit-after.json', 'utf8'));
          const summary = audit.metadata?.vulnerabilities ?? {};
          console.log('post-remediation audit summary', summary);
          if ((summary.critical ?? 0) > 0 || (summary.high ?? 0) > 0) {
            console.log('Remaining high/critical dependency paths:');
            const vulnerable = Object.entries(audit.vulnerabilities ?? {})
              .filter(([, value]) => ['high', 'critical'].includes(value.severity));
            for (const [name, value] of vulnerable) {
              console.log(JSON.stringify({ name, severity: value.severity, nodes: value.nodes, fixAvailable: value.fixAvailable }, null, 2));
            }
            process.exit(1);
          }
          NODE
      - name: Validate Expo and strict TypeScript after remediation
        shell: bash
        run: |
          set -euo pipefail
          npx expo-doctor
          npx tsc --noEmit --pretty false
          node scripts/validate-offline-event-handshake.mjs
      - name: Commit validated lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No compatible lockfile remediation was required.'
            exit 0
          fi
          git commit -m 'chore(deps): apply compatible transitive security fixes'
          git push origin HEAD:${GITHUB_REF_NAME}
