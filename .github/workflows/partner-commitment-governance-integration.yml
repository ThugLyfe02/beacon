name: Partner commitment governance integration

on:
  push:
    branches:
      - feature/spatial-event-digital-twin

permissions:
  contents: write

concurrency:
  group: partner-commitment-governance-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Integrate commitment governance into shared ledger
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/components/PartnerCommitmentLedgerPanel.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const importLine = "import PartnerCommitmentGovernanceCard from './PartnerCommitmentGovernanceCard';";
          if (!source.includes(importLine)) {
            const marker = "import { palette, radii, spacing } from '../theme';";
            if (!source.includes(marker)) throw new Error('PartnerCommitmentLedgerPanel import seam not found');
            source = source.replace(marker, `${marker}\n${importLine}`);
          }

          const component = '<PartnerCommitmentGovernanceCard scope={scope} />';
          if (!source.includes(component)) {
            const marker = "          {scope.scopeKind === 'event-exchange' && scope.canPrefillProgram ? (";
            if (!source.includes(marker)) throw new Error('PartnerCommitmentLedgerPanel governance insertion seam not found');
            source = source.replace(marker, `          ${component}\n\n${marker}`);
          }

          fs.writeFileSync(path, source);
          NODE

      - name: Validate governance integration
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit --pretty false
          node scripts/validate-partner-commitment-ledger.mjs
          node scripts/validate-partner-commitment-template-effectiveness.mjs
          node scripts/validate-partner-commitment-governance.mjs
          node scripts/test-partner-commitment-semantics.mjs
          node scripts/test-partner-commitment-template-semantics.mjs
          node scripts/validate-community-partner-programs.mjs
          node scripts/validate-product-preservation.mjs

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PartnerCommitmentLedgerPanel.tsx
          if git diff --cached --quiet; then
            echo 'Governance card already integrated.'
            exit 0
          fi
          git commit -m 'feat(partners): integrate commitment governance control plane'
          git push origin HEAD:${GITHUB_REF_NAME}
