name: PR3 Toolchain Refresh

on:
  push:
    branches:
      - feature/spatial-navigation-cinematic-world

permissions:
  contents: read

jobs:
  refresh:
    if: startsWith(github.event.head_commit.message, 'chore(toolchain): generate Expo SDK 55 refresh artifact')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      EXPO_PUBLIC_SENTRY_ENV: ci
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/spatial-navigation-cinematic-world
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Align packages to the installed Expo SDK
        run: npx expo install --fix

      - name: Capture Expo Doctor result
        shell: bash
        run: |
          set +e
          npx expo-doctor > expo-doctor-refreshed.txt 2>&1
          echo $? > expo-doctor-exit-code.txt
          cat expo-doctor-refreshed.txt
          exit 0

      - name: Capture refreshed production audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-refreshed.json
          echo $? > npm-audit-exit-code.txt
          npm audit --omit=dev || true
          exit 0

      - name: Capture dependency diff
        run: git diff -- package.json package-lock.json > toolchain-refresh.patch

      - name: Upload regenerated toolchain
        uses: actions/upload-artifact@v4
        with:
          name: pr3-toolchain-refresh
          retention-days: 1
          if-no-files-found: error
          path: |
            package.json
            package-lock.json
            toolchain-refresh.patch
            expo-doctor-refreshed.txt
            expo-doctor-exit-code.txt
            npm-audit-refreshed.json
            npm-audit-exit-code.txt
