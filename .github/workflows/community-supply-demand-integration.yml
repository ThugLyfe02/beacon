name: Community supply-demand integration

on:
  push:
    branches:
      - feature/spatial-event-digital-twin

permissions:
  contents: write

concurrency:
  group: community-supply-demand-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Integrate partner supply-demand planning
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/screens/CommunityExchangeScreen.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const importAnchor = "import CommunityPartnerProgramsPanel from '../components/CommunityPartnerProgramsPanel';\n";
          const importAfter = "import CommunityPartnerProgramsPanel from '../components/CommunityPartnerProgramsPanel';\nimport CommunitySupplyDemandPanel from '../components/CommunitySupplyDemandPanel';\n";
          if ((source.split(importAnchor).length - 1) !== 1) throw new Error('supply-demand import anchor mismatch');
          source = source.replace(importAnchor, importAfter);

          const renderAnchor = "      <View style={styles.section}>\n        <CommunityPartnerProgramsPanel";
          const renderAfter = "      <View style={styles.section}>\n        <CommunitySupplyDemandPanel\n          eventId={eventId}\n          activePartnerships={activePartnerships}\n          visibleToOperator={isHost || activePartnerships.some((item) => item.caller_is_owner)}\n        />\n      </View>\n\n      <View style={styles.section}>\n        <CommunityPartnerProgramsPanel";
          if ((source.split(renderAnchor).length - 1) !== 1) throw new Error('supply-demand render anchor mismatch');
          source = source.replace(renderAnchor, renderAfter);
          fs.writeFileSync(path, source);
          NODE

      - name: Validate strict types and architecture
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit --pretty false
          node scripts/validate-community-exchange.mjs
          node scripts/validate-community-partner-programs.mjs
          node scripts/validate-community-supply-demand.mjs
          node scripts/validate-warm-introductions.mjs
          node scripts/validate-venue-operations.mjs

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/CommunityExchangeScreen.tsx
          git commit -m 'feat(community): integrate partner supply-demand planning'
          git push origin HEAD:${GITHUB_REF_NAME}
