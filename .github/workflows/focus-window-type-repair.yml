name: Focus window type repair

on:
  push:
    branches:
      - feature/spatial-event-digital-twin

permissions:
  contents: write

concurrency:
  group: focus-window-type-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Repair strict UI and architecture boundaries
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const componentPath = 'src/components/HostFocusWindowPanel.tsx';
          const component = fs.readFileSync(componentPath, 'utf8');
          const beforeTone = `function formatTone(format: EventFocusWindowFormat): Tone {
            if (format === 'mentor-desk') return 'premium';
            if (format === 'office-hours') return 'warning';
            if (format === 'roundtable') return 'accent' as Tone;
            return 'neutral';
          }`.replace(/^          /gm, '');
          const afterTone = `function formatTone(
            format: EventFocusWindowFormat,
          ): 'accent' | 'premium' | 'warning' | 'muted' {
            if (format === 'mentor-desk') return 'premium';
            if (format === 'office-hours') return 'warning';
            if (format === 'roundtable') return 'accent';
            return 'muted';
          }`.replace(/^          /gm, '');
          if (!component.includes(beforeTone)) {
            throw new Error('Expected formatTone implementation was not found; refusing a blind rewrite.');
          }
          fs.writeFileSync(componentPath, component.replace(beforeTone, afterTone));

          const validatorPath = 'scripts/validate-event-focus-windows.mjs';
          const validator = fs.readFileSync(validatorPath, 'utf8');
          const beforeValidator = "requireText('src/components/EventFocusWindowCard.tsx', 'explicit event focus', 'participant UI must explain why the window is visible');";
          const afterValidator = "requireText('src/components/EventFocusWindowCard.tsx', 'intersect with selections you explicitly made', 'participant UI must explain why the window is visible');";
          if (!validator.includes(beforeValidator)) {
            throw new Error('Expected focus-window visibility assertion was not found; refusing a blind rewrite.');
          }
          fs.writeFileSync(validatorPath, validator.replace(beforeValidator, afterValidator));
          NODE

      - name: Validate strict types and architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit --pretty false
          node scripts/validate-venue-operations.mjs
          node scripts/validate-venue-memory.mjs
          node scripts/validate-venue-sensor-ingress.mjs
          node scripts/validate-spatial-direction.mjs
          node scripts/validate-participant-venue-guide.mjs
          node scripts/validate-event-intent-exchange.mjs
          node scripts/validate-event-focus-windows.mjs

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/HostFocusWindowPanel.tsx scripts/validate-event-focus-windows.mjs
          git commit -m 'fix(events): align focus-window UI and validation boundaries'
          git push origin HEAD:${GITHUB_REF_NAME}
